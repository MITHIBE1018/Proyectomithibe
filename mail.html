<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=<div>>, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <title>Document</title>

    <style>
        :root{
    --white: #ffffff;
    --black: #000000;
    --very-light-pink: #c7c7c7;
    --text-input-field: #f7f7f7;
    --hospital-green: #acd9b2;
    --sm: 20px;
    --md: 16px;
    --lg: 25px;
}
 
        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            width:30%;
            height:30%;
            margin:0 auto;
            background-size: cover;
            background-image: url("./imagenes/fondoemail.jpg");
            background-position: center; 
        }
        .login {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
        }
        .form-container {
            display: grid;
            grid-template-rows: auto 1fr
            auto;
            width: 300px;
            justify-items: center;
        }
        .logo {
            height: 150px;
            width: 150px;
            margin-bottom: 50px;
            justify-self: center;
            display: none;
        }
        .tittle {
            color: navy;
          font-size: var(--lg);
          margin-bottom: 100px;
          text-align: center;
          
        }
        .subtittle {
            color: green;
            font-size:  var(--very-light-pink);
            font-size: var(--md);
            font-weight: 300;
            margin-bottom: 50px;
            text-align: center;
        }
        .Email-image{
            width: 132px;
            height: 132px;
            border-radius: 50%;
            background-color:rgb(108, 108, 110);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
           
        }
        .Resend a{
            font-size: var(--sm);
            text-decoration: none;
        }
        .Primary-button {
            background-color: rgb(177, 221, 182);
            border-radius: 8px;
            border: none;
            color: var(--black);
            width: 100%;
            cursor: pointer;
            font-size: var(--md);
            font-weight: bold;
            height: 50px;
            
        }

        .login-button {
            margin-top: 14px;
            margin-bottom: 30px;
        }

        @media (max-width: 4000px){
            .logo{
                display: block;
                margin-top: 14px;
            }
        }

    </style>
</head>
<body>

    <div class="login">
<div class="form-container">
   <img src="./imagenes/foto.png" alt="logo" class="logo"> 

  <h2 class="tittle"><p>Email has been sent!</p></h2>
       <p class="subtittle"><b>Please check yout inbox for intructions on how to reset the password</b></p>
    
       <div class="Email-image">
        <img src="./iconos/charla.png" alt="Email-image">
       </div>
       <button class="Primary-button login-button">Login</button>

       <p class="Resend">
        <span>Don't receive the email?</span>
        <a href="/">Resend</a>
        </p>
</div>
    </div>
    
</body>
</html>
