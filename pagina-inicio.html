    .cards-container {

      gap: 26px;
    }

    .product-card {
      width: 240px;
    }
    .product-card img {
      width: 240px;
      height: 240px;
      border-radius: 20px;
      object-fit: cover;
    }
    .producto-imformación {
      color: blue;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    .producto-imformación figure {
      margin: 0;
    }
    .producto-imformación img {
      width: 50px;
      height: 50px;
      border-radius: 20px;

    }
