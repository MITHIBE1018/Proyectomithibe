    <style>
        :root{
    --white: #ffffff;
    --black: #000000;
    --very-light-pink: #c7c7c7;

    --hospital-green: #acd9b2;
    --sm: 14px;
    --md: 16px;
    --lg: 25px;
}
 
        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            background: #ECF0F1 ;
        }
        .imagen{
            background-image: url("https://img.freepik.com/vector-gratis/conjunto-objetos-relacionados-videojuegos-neon-estilo-lineal_24908-58670.jpg?w=1380&t=st=1668194759~exp=1668195359~hmac=fa621c98bf182f9afd58795b2240c80060c29fde1453a5b550c9099e1f7e3159");
        }
        .login {
            width: 100%;
            height: 100vh;
            display: grid;
            place-items: center;
        }
        .form-container {
            display: grid;
            grid-template-rows: auto 1fr
            auto;
            width: 300px;
        }
        .logo {
            height: 150px;
            width: 150px;
            margin-bottom: 50px;
            justify-self: center;
            display: none;
        }
        .tittle {
        background: white;
          font-size: var(--lg);
          margin-bottom: 150px;
          text-align: center;
          
        }
        .subtittle {
            color: whitesmoke;
            font-size:  var(--very-light-pink);
            font-size: var(--md);
            font-weight: 300;
            margin-bottom: 45px;
            text-align: center;
        }
        .form{
            display: flex;
            flex-direction: column;
        }

        .label{
            font-size:  var(--sm);
            font-weight: bold;
            margin-bottom: 4px;
        }

        .input{
            background-color: var(--text-input-field);
            border: none;
            border-radius: 8px;
            height: 30px;
            font-size: var(--md);
            padding: 6px;
            margin-bottom: 12px;
        }
        
        .primary-button {
            background-color: chartreuse;
            border-radius: 8px;
            border: none;
            color: var(--black);
            width: 100%;
            cursor: pointer;
            font-size: var(--md);
            font-weight: bold;
            height: 50px;
        }

        .login-button {
            margin-top: 14px;
            margin-bottom: 30px;
        }

        @media (max-width: 4000px){
            .logo{
                display: block;
            }
        }
      
    </style>
</head>
